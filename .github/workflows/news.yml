name: Nachrichten des Tages

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 05:17 Uhr Wiener Winterzeit (04:17 UTC)
  workflow_dispatch:        # Knopf "Run workflow" zum Ausprobieren

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nachrichten holen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/news.py
      - name: Speichern
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A news.json news_img
          git diff --cached --quiet || git commit -m "Nachrichten vom $(date +%F)"
          git pull --rebase -q || true
          git push
